name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake (navy + gold theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-gold.svg?color_snake=#EDCC80&color_dots=#2B3653,#3d4d77,#8a7547,#c9ab69,#EDCC80&dark_color_dots=#2B3653,#3d4d77,#8a7547,#c9ab69,#EDCC80

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
